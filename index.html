<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resistor & Bulb Dimmer Simulation</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Inter Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 22px;
            width: 22px;
            border-radius: 50%;
            background: #a855f7;
            cursor: pointer;
            box-shadow: 0 0 12px rgba(168, 85, 247, 0.6);
            transition: transform 0.15s ease, background-color 0.15s ease;
        }
        input[type=range]::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center justify-center p-4">

    <!-- Header Section -->
    <header class="text-center mb-6">
        <h1 class="text-3xl md:text-4xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-purple-400 via-amber-300 to-amber-500">
            Resistor & Light Bulb Circuit Simulation
        </h1>
        <p class="text-slate-400 text-sm md:text-base mt-2">
            Resistor တန်ဖိုး တိုးလာပါက မီးသီးအလင်းရောင် မှိန်သွားပုံကို လေ့လာရန်
        </p>
    </header>

    <!-- Main Card Container -->
    <div class="w-full max-w-4xl bg-slate-800/90 backdrop-blur border border-slate-700/60 rounded-2xl shadow-2xl p-6 flex flex-col items-center">
        
        <!-- Canvas Container -->
        <div class="w-full relative bg-slate-950 rounded-xl overflow-hidden border border-slate-800 shadow-inner mb-6">
            <canvas id="circuitCanvas" class="w-full h-[320px] md:h-[380px] block"></canvas>
        </div>

        <!-- Controls Grid -->
        <div class="w-full grid grid-cols-1 md:grid-cols-2 gap-6 bg-slate-900/70 p-5 rounded-xl border border-slate-800">
            
            <!-- Voltage Control (Fixed at 4V but editable if needed) -->
            <div class="flex flex-col gap-2">
                <label for="voltageInput" class="text-sm font-semibold text-purple-400 flex items-center gap-2">
                    <span class="w-3 h-3 rounded-full bg-purple-500"></span>
                    Power Supply Voltage (ဗို့အား):
                </label>
                <div class="flex items-center gap-2">
                    <input type="number" id="voltageInput" value="4" min="1" max="24" step="1" readonly
                        class="w-full bg-slate-800 border border-slate-700 rounded-lg px-4 py-2 text-purple-300 font-bold focus:outline-none cursor-not-allowed">
                    <span class="text-slate-400 font-bold">V</span>
                </div>
            </div>

            <!-- Resistor Control Slider -->
            <div class="flex flex-col gap-2">
                <div class="flex justify-between items-center">
                    <label for="resistorSlider" class="text-sm font-semibold text-purple-300 flex items-center gap-2">
                        <span class="w-3 h-3 rounded-full bg-purple-400"></span>
                        Resistor Value (ခုခံမှုတန်ဖိုး - R):
                    </label>
                    <span id="brightnessBadge" class="text-xs font-bold px-2.5 py-1 rounded-full bg-amber-500/20 text-amber-300 border border-amber-500/30">
                        100% လင်း
                    </span>
                </div>
                
                <div class="flex items-center gap-3">
                    <input type="range" id="resistorSlider" min="0" max="500" value="0" step="5"
                        class="w-full h-2 bg-slate-700 rounded-lg appearance-none cursor-pointer">
                    <div class="flex items-center gap-1">
                        <input type="number" id="resistorInput" value="0" min="0" max="1000" step="5"
                            class="w-24 bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-purple-300 font-bold text-right focus:outline-none focus:border-purple-500 transition-colors">
                        <span class="text-slate-400 font-bold">Ω</span>
                    </div>
                </div>
            </div>

        </div>

        <!-- Real-time Calculation Readout Display -->
        <div class="mt-6 w-full grid grid-cols-2 md:grid-cols-4 gap-4 text-center">
            <div class="bg-slate-950/80 p-3 rounded-lg border border-slate-800">
                <span class="text-xs text-slate-400 block mb-1">မီးသီး ဗို့အား (Bulb Voltage)</span>
                <span id="readoutVoltage" class="text-xl font-extrabold text-purple-400">4 V</span>
            </div>
            <div class="bg-slate-950/80 p-3 rounded-lg border border-slate-800">
                <span class="text-xs text-slate-400 block mb-1">ခုခံမှု (Resistance)</span>
                <span id="readoutResistance" class="text-xl font-extrabold text-purple-300">0 Ω</span>
            </div>
            <div class="bg-slate-950/80 p-3 rounded-lg border border-slate-800">
                <span class="text-xs text-slate-400 block mb-1">လျှပ်စီးကြောင်း (Current)</span>
                <span id="readoutCurrent" class="text-xl font-extrabold text-cyan-400">400 mA</span>
            </div>
            <div class="bg-slate-950/80 p-3 rounded-lg border border-slate-800">
                <span class="text-xs text-slate-400 block mb-1">မီးသီး အလင်း %</span>
                <span id="readoutBrightness" class="text-xl font-extrabold text-amber-400">100%</span>
            </div>
        </div>

    </div>

    <!-- JavaScript Simulation Logic -->
    <script>
        const canvas = document.getElementById('circuitCanvas');
        const ctx = canvas.getContext('2d');

        const voltageInput = document.getElementById('voltageInput');
        const resistorSlider = document.getElementById('resistorSlider');
        const resistorInput = document.getElementById('resistorInput');
        const brightnessBadge = document.getElementById('brightnessBadge');

        const readoutVoltage = document.getElementById('readoutVoltage');
        const readoutResistance = document.getElementById('readoutResistance');
        const readoutCurrent = document.getElementById('readoutCurrent');
        const readoutBrightness = document.getElementById('readoutBrightness');

        // Circuit parameters
        const bulbInternalResistance = 50; // Raised internal resistance for better scale matching
        let voltage = 4;
        let resistorValue = 0;
        let totalResistance = bulbInternalResistance + resistorValue;
        let currentAmps = voltage / totalResistance;
        let bulbVoltage = voltage;
        let brightnessFactor = 1.0; // 0 to 1

        // Current flow particles
        const particles = [];
        const numParticles = 25;
        for (let i = 0; i < numParticles; i++) {
            particles.push({
                progress: Math.random(),
            });
        }

        function resizeCanvas() {
            const rect = canvas.getBoundingClientRect();
            canvas.width = rect.width * window.devicePixelRatio;
            canvas.height = rect.height * window.devicePixelRatio;
            ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function updateCalculations() {
            voltage = parseFloat(voltageInput.value) || 4;
            resistorValue = parseFloat(resistorInput.value) || 0;

            totalResistance = resistorValue + bulbInternalResistance;
            currentAmps = voltage / totalResistance;
            bulbVoltage = currentAmps * bulbInternalResistance;

            // Power dissipated by bulb
            const maxPower = Math.pow(voltage, 2) / bulbInternalResistance;
            const currentPower = Math.pow(bulbVoltage, 2) / bulbInternalResistance;
            
            // Physical power ratio
            const rawPowerRatio = currentPower / maxPower;

            // Perceptual Brightness Curve (Square Root curve models human visual perception of brightness smoother)
            brightnessFactor = Math.min(1, Math.max(0, Math.sqrt(rawPowerRatio)));
            const brightnessPercent = Math.round(brightnessFactor * 100);

            // Update DOM Readouts
            readoutVoltage.textContent = `${bulbVoltage.toFixed(2)} V`;
            readoutResistance.textContent = `${resistorValue} Ω`;
            
            if (currentAmps >= 1) {
                readoutCurrent.textContent = `${currentAmps.toFixed(2)} A`;
            } else {
                readoutCurrent.textContent = `${Math.round(currentAmps * 1000)} mA`;
            }

            readoutBrightness.textContent = `${brightnessPercent}%`;

            // Badge text & status
            if (brightnessPercent > 75) {
                brightnessBadge.textContent = `${brightnessPercent}% (အတောက်ပဆုံး)`;
                brightnessBadge.className = "text-xs font-bold px-2.5 py-1 rounded-full bg-amber-500/20 text-amber-300 border border-amber-500/30";
            } else if (brightnessPercent > 40) {
                brightnessBadge.textContent = `${brightnessPercent}% (အသင့်အတင့်)`;
                brightnessBadge.className = "text-xs font-bold px-2.5 py-1 rounded-full bg-yellow-500/20 text-yellow-400 border border-yellow-500/30";
            } else if (brightnessPercent > 10) {
                brightnessBadge.textContent = `${brightnessPercent}% (အလင်းမှိန်)`;
                brightnessBadge.className = "text-xs font-bold px-2.5 py-1 rounded-full bg-orange-500/20 text-orange-400 border border-orange-500/30";
            } else {
                brightnessBadge.textContent = `0% (မီးငြိမ်းလုနီးပါး)`;
                brightnessBadge.className = "text-xs font-bold px-2.5 py-1 rounded-full bg-slate-700 text-slate-400 border border-slate-600";
            }
        }

        // Event Listeners for inputs
        resistorSlider.addEventListener('input', (e) => {
            resistorInput.value = e.target.value;
            updateCalculations();
        });

        resistorInput.addEventListener('input', (e) => {
            resistorSlider.value = e.target.value;
            updateCalculations();
        });

        // Drawing Helper: Zigzag Resistor
        function drawResistor(ctx, x, y, width, height) {
            const segments = 6;
            const segWidth = width / segments;

            ctx.beginPath();
            ctx.moveTo(x - width / 2, y);

            for (let i = 0; i < segments; i++) {
                const segX = (x - width / 2) + (i + 0.5) * segWidth;
                const segY = (i % 2 === 0) ? y - height / 2 : y + height / 2;
                ctx.lineTo(segX, segY);
            }

            ctx.lineTo(x + width / 2, y);
            ctx.strokeStyle = '#a855f7';
            ctx.lineWidth = 3;
            ctx.stroke();

            // Label
            ctx.fillStyle = '#c084fc';
            ctx.font = 'bold 22px Inter, sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'bottom';
            ctx.fillText(`${resistorValue} R`, x, y - height / 2 - 8);
        }

        // Drawing Helper: Ground Symbol
        function drawGround(ctx, x, y) {
            ctx.strokeStyle = '#94a3b8';
            ctx.lineWidth = 3;

            // Vertical wire to ground
            ctx.beginPath();
            ctx.moveTo(x, y - 10);
            ctx.lineTo(x, y);
            ctx.stroke();

            // Horizontal ground bars
            const widths = [32, 20, 10];
            const spacing = 6;
            widths.forEach((w, index) => {
                ctx.beginPath();
                ctx.moveTo(x - w / 2, y + index * spacing);
                ctx.lineTo(x + w / 2, y + index * spacing);
                ctx.stroke();
            });
        }

        // Drawing Helper: Light Bulb with Dynamic Glow & Lightning Bolt
        function drawBulb(ctx, x, y, brightness) {
            const bulbRadius = 32;

            // 1. Dynamic Outer Glow Aura
            if (brightness > 0.02) {
                const glowRadius = bulbRadius + (brightness * 55);
                const radialGlow = ctx.createRadialGradient(x, y, bulbRadius * 0.5, x, y, glowRadius);
                radialGlow.addColorStop(0, `rgba(251, 191, 36, ${0.85 * brightness})`);
                radialGlow.addColorStop(0.5, `rgba(245, 158, 11, ${0.4 * brightness})`);
                radialGlow.addColorStop(1, 'rgba(245, 158, 11, 0)');

                ctx.beginPath();
                ctx.arc(x, y, glowRadius, 0, Math.PI * 2);
                ctx.fillStyle = radialGlow;
                ctx.fill();

                // Glowing Rays around bulb
                const rayCount = 12;
                const innerRay = bulbRadius + 8;
                const outerRay = innerRay + (brightness * 18);
                
                ctx.strokeStyle = `rgba(252, 211, 77, ${0.9 * brightness})`;
                ctx.lineWidth = 3;

                for (let i = 0; i < rayCount; i++) {
                    const angle = (i * Math.PI * 2) / rayCount;
                    const startX = x + Math.cos(angle) * innerRay;
                    const startY = y + Math.sin(angle) * innerRay;
                    const endX = x + Math.cos(angle) * outerRay;
                    const endY = y + Math.sin(angle) * outerRay;

                    ctx.beginPath();
                    ctx.moveTo(startX, startY);
                    ctx.lineTo(endX, endY);
                    ctx.stroke();
                }
            }

            // 2. Bulb Glass Body Base
            ctx.beginPath();
            ctx.arc(x, y, bulbRadius, 0, Math.PI * 2);
            
            // Glass color gradient based on brightness
            const glassGrad = ctx.createRadialGradient(x - 8, y - 8, 4, x, y, bulbRadius);
            if (brightness > 0.05) {
                glassGrad.addColorStop(0, '#ffffff');
                glassGrad.addColorStop(0.4, `rgba(252, 211, 77, ${0.3 + 0.7 * brightness})`);
                glassGrad.addColorStop(1, `rgba(245, 158, 11, ${0.5 + 0.5 * brightness})`);
            } else {
                glassGrad.addColorStop(0, '#64748b');
                glassGrad.addColorStop(1, '#334155');
            }
            ctx.fillStyle = glassGrad;
            ctx.fill();

            ctx.strokeStyle = brightness > 0.1 ? '#fef08a' : '#475569';
            ctx.lineWidth = 3;
            ctx.stroke();

            // 3. Lightning Bolt inside Bulb
            ctx.beginPath();
            ctx.moveTo(x + 2, y - 16);
            ctx.lineTo(x - 10, y + 2);
            ctx.lineTo(x - 2, y + 2);
            ctx.lineTo(x - 6, y + 16);
            ctx.lineTo(x + 10, y - 2);
            ctx.lineTo(x + 2, y - 2);
            ctx.closePath();

            ctx.fillStyle = brightness > 0.05 
                ? `rgba(255, 255, 255, ${0.6 + 0.4 * brightness})` 
                : '#94a3b8';
            ctx.fill();

            // 4. Metallic Bulb Base Socket (Left Side)
            const socketWidth = 22;
            const socketHeight = 32;
            const socketX = x - bulbRadius - socketWidth + 6;
            const socketY = y - socketHeight / 2;

            ctx.fillStyle = '#475569';
            ctx.fillRect(socketX, socketY, socketWidth, socketHeight);

            // Socket Thread Ridges
            ctx.strokeStyle = '#94a3b8';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(socketX + 5, socketY + 6);
            ctx.lineTo(socketX + 5, socketY + socketHeight - 6);
            ctx.moveTo(socketX + 11, socketY + 6);
            ctx.lineTo(socketX + 11, socketY + socketHeight - 6);
            ctx.stroke();
        }

        // Main Animation Loop
        function animate() {
            const w = canvas.getBoundingClientRect().width;
            const h = canvas.getBoundingClientRect().height;

            ctx.clearRect(0, 0, w, h);

            // Layout Coordinates
            const mainY = h * 0.45;
            const startX = 70;
            const endX = w - 120;

            const resistorX = startX + (endX - startX) * 0.42;
            const resistorWidth = 80;

            const bulbX = endX;
            const bulbY = mainY;
            const groundY = bulbY + 110;

            // --- 1. Draw Circuit Wire (4V Source -> Resistor -> Bulb) ---
            ctx.strokeStyle = '#3b82f6';
            ctx.lineWidth = 3;

            // Wire part 1: 4V to Resistor
            ctx.beginPath();
            ctx.moveTo(startX, mainY);
            ctx.lineTo(resistorX - resistorWidth / 2, mainY);
            ctx.stroke();

            // Wire part 2: Resistor to Bulb
            ctx.beginPath();
            ctx.moveTo(resistorX + resistorWidth / 2, mainY);
            ctx.lineTo(bulbX - 45, mainY);
            ctx.stroke();

            // Wire part 3: Bulb to Ground Wire
            ctx.beginPath();
            ctx.moveTo(bulbX - 45, mainY + 12);
            ctx.lineTo(bulbX - 45, groundY - 10);
            ctx.strokeStyle = '#64748b';
            ctx.stroke();

            // --- 2. Draw 4V Power Label on Left ---
            ctx.fillStyle = '#c084fc';
            ctx.font = 'bold 26px Inter, sans-serif';
            ctx.textAlign = 'right';
            ctx.textBaseline = 'middle';
            ctx.fillText(`${voltage}V`, startX - 15, mainY);

            // Left Source Node Dot
            ctx.beginPath();
            ctx.arc(startX, mainY, 5, 0, Math.PI * 2);
            ctx.fillStyle = '#a855f7';
            ctx.fill();

            // --- 3. Draw Resistor Symbol ---
            drawResistor(ctx, resistorX, mainY, resistorWidth, 30);

            // --- 4. Draw Bulb & Ground ---
            drawBulb(ctx, bulbX, bulbY, brightnessFactor);
            drawGround(ctx, bulbX - 45, groundY);

            // --- 5. Flowing Particle Animation (Current Flow) ---
            // Speed correlates with current I
            const speedScale = 0.001 + (currentAmps * 0.025);

            particles.forEach(p => {
                p.progress += speedScale;
                if (p.progress > 1) p.progress = 0;

                let px, py;
                const pathLength1 = (resistorX - resistorWidth / 2) - startX;
                const pathLength2 = (bulbX - 45) - (resistorX + resistorWidth / 2);
                const pathLength3 = (groundY - 10) - (mainY + 12);
                const totalPathLength = pathLength1 + pathLength2 + pathLength3;

                const currentDist = p.progress * totalPathLength;

                if (currentDist < pathLength1) {
                    // Segment 1: Start -> Resistor
                    px = startX + currentDist;
                    py = mainY;
                } else if (currentDist < pathLength1 + pathLength2) {
                    // Segment 2: Resistor -> Bulb
                    px = (resistorX + resistorWidth / 2) + (currentDist - pathLength1);
                    py = mainY;
                } else {
                    // Segment 3: Bulb -> Ground
                    px = bulbX - 45;
                    py = (mainY + 12) + (currentDist - pathLength1 - pathLength2);
                }

                // Particle size & glow dependent on current
                const pSize = Math.max(1.5, Math.min(4, 1.5 + currentAmps * 6));
                
                ctx.beginPath();
                ctx.arc(px, py, pSize, 0, Math.PI * 2);
                ctx.fillStyle = '#38bdf8';
                ctx.shadowColor = '#0284c7';
                ctx.shadowBlur = currentAmps > 0.05 ? 6 : 0;
                ctx.fill();
                ctx.shadowBlur = 0;
            });

            requestAnimationFrame(animate);
        }

        // Initial setup and trigger
        updateCalculations();
        requestAnimationFrame(animate);
    </script>
</body>
</html>

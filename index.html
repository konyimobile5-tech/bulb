<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resistor နှင့် မီးသီး အလင်းရောင် စိစစ်မှု (Linear Simulation)</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: #0b0f19;
            color: #f1f5f9;
            font-family: 'Padauk', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        .container {
            width: 100%;
            max-width: 900px;
            background: #151d2a;
            border: 1px solid #233044;
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        header {
            text-align: center;
        }

        h1 {
            font-size: 1.6rem;
            font-weight: 800;
            background: linear-gradient(135deg, #a855f7, #f59e0b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 6px;
        }

        p.subtitle {
            color: #94a3b8;
            font-size: 0.95rem;
        }

        .canvas-container {
            position: relative;
            width: 100%;
            height: 380px;
            background-color: #070a12;
            border: 1px solid #1e293b;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: inset 0 0 20px rgba(0, 0, 0, 0.8);
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        .controls-panel {
            background: #0f172a;
            border: 1px solid #1e293b;
            border-radius: 12px;
            padding: 20px;
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }

        @media (min-width: 640px) {
            .controls-panel {
                grid-template-columns: 1fr 1fr;
            }
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .control-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        label {
            font-weight: 600;
            font-size: 0.95rem;
            color: #cbd5e1;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: inline-block;
        }

        .slider-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            height: 8px;
            border-radius: 4px;
            background: #334155;
            outline: none;
        }

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: #a855f7;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(168, 85, 247, 0.8);
            transition: transform 0.1s ease, background 0.15s ease;
        }

        input[type=range]::-webkit-slider-thumb:hover {
            transform: scale(1.15);
            background: #c084fc;
        }

        .value-display {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 6px;
            padding: 6px 12px;
            font-weight: 700;
            color: #38bdf8;
            min-width: 90px;
            text-align: center;
            font-size: 0.95rem;
        }

        .badge {
            font-size: 0.8rem;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 20px;
            text-transform: uppercase;
        }

        .badge-bright {
            background: rgba(245, 158, 11, 0.2);
            color: #fbbf24;
            border: 1px solid rgba(245, 158, 11, 0.4);
        }

        .badge-half {
            background: rgba(59, 130, 246, 0.2);
            color: #60a5fa;
            border: 1px solid rgba(59, 130, 246, 0.4);
        }

        .badge-off {
            background: rgba(239, 68, 68, 0.2);
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.4);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        @media (min-width: 640px) {
            .stats-grid {
                grid-template-columns: repeat(4, 1fr);
            }
        }

        .stat-card {
            background: #0f172a;
            border: 1px solid #1e293b;
            border-radius: 10px;
            padding: 12px;
            text-align: center;
        }

        .stat-label {
            font-size: 0.8rem;
            color: #64748b;
            margin-bottom: 4px;
        }

        .stat-value {
            font-size: 1.15rem;
            font-weight: 800;
        }

        .text-purple { color: #c084fc; }
        .text-blue { color: #38bdf8; }
        .text-amber { color: #fbbf24; }
        .text-cyan { color: #22d3ee; }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Resistor နှင့် မီးသီး အလင်းရောင် စိစစ်မှု (Linear Simulation)</h1>
            <p class="subtitle">Resistor တန်ဖိုး တိုးလျှော့မှုအပေါ် မီးသီးအလင်းရောင် တိုက်ရိုက် ပြောင်းလဲပုံ</p>
        </header>

        <!-- Canvas Circuit Diagram -->
        <div class="canvas-container">
            <canvas id="circuitCanvas"></canvas>
        </div>

        <!-- Interactive Controls -->
        <div class="controls-panel">
            <!-- Resistor Slider -->
            <div class="control-group">
                <div class="control-header">
                    <label for="resistorSlider">
                        <span class="dot" style="background: #a855f7;"></span>
                        Resistor တန်ဖိုး (R)
                    </label>
                    <span id="brightnessBadge" class="badge badge-bright">၁၀၀% အပြည့်</span>
                </div>
                <div class="slider-container">
                    <input type="range" id="resistorSlider" min="0" max="500" value="0" step="1">
                    <div class="value-display" id="resistorText">0 Ω</div>
                </div>
            </div>

            <!-- Fixed Voltage Display -->
            <div class="control-group">
                <div class="control-header">
                    <label>
                        <span class="dot" style="background: #38bdf8;"></span>
                        ပင်မ ဗို့အား (Voltage)
                    </label>
                </div>
                <div class="slider-container">
                    <input type="range" id="voltageSlider" min="1" max="12" value="4" step="1" disabled style="opacity: 0.5; cursor: not-allowed;">
                    <div class="value-display" style="color: #c084fc;">4 V</div>
                </div>
            </div>
        </div>

        <!-- Numerical Readouts -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-label">Resistor ခံနိုင်ရည်</div>
                <div class="stat-value text-purple" id="statResistor">0 Ω</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">လျှပ်စီးကြောင်း (I)</div>
                <div class="stat-value text-cyan" id="statCurrent">400 mA</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">မီးသီး အလင်းရောင်</div>
                <div class="stat-value text-amber" id="statBrightness">100%</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">အခြေအနေ</div>
                <div class="stat-value text-blue" id="statStatus">လင်းနေသည်</div>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('circuitCanvas');
        const ctx = canvas.getContext('2d');
        const resistorSlider = document.getElementById('resistorSlider');
        const resistorText = document.getElementById('resistorText');
        const brightnessBadge = document.getElementById('brightnessBadge');

        const statResistor = document.getElementById('statResistor');
        const statCurrent = document.getElementById('statCurrent');
        const statBrightness = document.getElementById('statBrightness');
        const statStatus = document.getElementById('statStatus');

        const sourceVoltage = 4.0;
        const maxResistorValue = 500; // 500 Ohms max

        // Electron Particles Animation
        const numParticles = 25;
        const particles = [];
        for (let i = 0; i < numParticles; i++) {
            particles.push({ progress: Math.random() });
        }

        // DPI Scaling Fix for Smooth Canvas Rendering
        function resizeCanvas() {
            const rect = canvas.getBoundingClientRect();
            canvas.width = rect.width * window.devicePixelRatio;
            canvas.height = rect.height * window.devicePixelRatio;
            ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // Calculate Stats strictly Linear (1:1 Ratio)
        function getSimulationState() {
            const currentR = parseFloat(resistorSlider.value);
            
            // Linear Brightness Calculation: 
            // R = 0    => Brightness = 1.0 (100%)
            // R = 250  => Brightness = 0.5 (50%)
            // R = 500  => Brightness = 0.0 (0% - Off)
            const brightness = Math.max(0, Math.min(1, 1 - (currentR / maxResistorValue)));
            
            // Linear Current for display (0 to 400 mA)
            const currentmA = Math.round(brightness * 400);

            return { currentR, brightness, currentmA };
        }

        function updateUI() {
            const state = getSimulationState();
            
            resistorText.textContent = `${state.currentR} Ω`;
            statResistor.textContent = `${state.currentR} Ω`;
            statCurrent.textContent = `${state.currentmA} mA`;
            
            const percent = Math.round(state.brightness * 100);
            statBrightness.textContent = `${percent}%`;

            if (percent === 100) {
                brightnessBadge.textContent = "၁၀၀% အပြည့်";
                brightnessBadge.className = "badge badge-bright";
                statStatus.textContent = "အလင်းဆုံး";
            } else if (percent === 50) {
                brightnessBadge.textContent = "၅၀% တဝက်";
                brightnessBadge.className = "badge badge-half";
                statStatus.textContent = "တဝက်လင်း";
            } else if (percent === 0) {
                brightnessBadge.textContent = "လုံးဝမှိတ်";
                brightnessBadge.className = "badge badge-off";
                statStatus.textContent = "မှိတ်ထားသည်";
            } else {
                brightnessBadge.textContent = `${percent}%`;
                brightnessBadge.className = percent > 50 ? "badge badge-bright" : "badge badge-half";
                statStatus.textContent = "လင်းနေသည်";
            }
        }

        resistorSlider.addEventListener('input', updateUI);

        // --- CANVAS DRAWING FUNCTIONS ---

        function drawResistor(ctx, x, y, width, height, value) {
            const segments = 6;
            const segWidth = width / segments;

            ctx.beginPath();
            ctx.moveTo(x - width / 2, y);

            for (let i = 0; i < segments; i++) {
                const segX = (x - width / 2) + (i + 0.5) * segWidth;
                const segY = (i % 2 === 0) ? y - height / 2 : y + height / 2;
                ctx.lineTo(segX, segY);
            }

            ctx.lineTo(x + width / 2, y);
            ctx.strokeStyle = '#c084fc';
            ctx.lineWidth = 4;
            ctx.lineJoin = 'round';
            ctx.stroke();

            // Label
            ctx.fillStyle = '#e9d5ff';
            ctx.font = 'bold 20px -apple-system, sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'bottom';
            ctx.fillText(`${value} R`, x, y - height / 2 - 10);
        }

        function drawGround(ctx, x, y) {
            ctx.strokeStyle = '#64748b';
            ctx.lineWidth = 3;

            ctx.beginPath();
            ctx.moveTo(x, y - 12);
            ctx.lineTo(x, y);
            ctx.stroke();

            const bars = [28, 18, 8];
            bars.forEach((w, idx) => {
                ctx.beginPath();
                ctx.moveTo(x - w / 2, y + idx * 6);
                ctx.lineTo(x + w / 2, y + idx * 6);
                ctx.stroke();
            });
        }

        function drawLightbulb(ctx, x, y, brightness) {
            const radius = 34;

            // 1. GLOW AURA (Scales Linearly)
            if (brightness > 0) {
                const maxGlowRadius = radius + (brightness * 100);
                const glowGrad = ctx.createRadialGradient(x, y, radius * 0.3, x, y, maxGlowRadius);
                
                glowGrad.addColorStop(0, `rgba(255, 255, 255, ${0.9 * brightness})`);
                glowGrad.addColorStop(0.3, `rgba(254, 240, 138, ${0.75 * brightness})`);
                glowGrad.addColorStop(0.6, `rgba(245, 158, 11, ${0.4 * brightness})`);
                glowGrad.addColorStop(1, 'rgba(245, 158, 11, 0)');

                ctx.beginPath();
                ctx.arc(x, y, maxGlowRadius, 0, Math.PI * 2);
                ctx.fillStyle = glowGrad;
                ctx.fill();

                // 2. SUNBURST RAYS (Scales Linearly)
                const rayCount = 12;
                const innerRay = radius + 8;
                const outerRay = innerRay + (brightness * 32);
                
                ctx.strokeStyle = `rgba(254, 240, 138, ${0.85 * brightness})`;
                ctx.lineWidth = 3;
                ctx.lineCap = 'round';

                for (let i = 0; i < rayCount; i++) {
                    const angle = (i * Math.PI * 2) / rayCount;
                    ctx.beginPath();
                    ctx.moveTo(x + Math.cos(angle) * innerRay, y + Math.sin(angle) * innerRay);
                    ctx.lineTo(x + Math.cos(angle) * outerRay, y + Math.sin(angle) * outerRay);
                    ctx.stroke();
                }
            }

            // 3. BULB GLASS DOME
            ctx.beginPath();
            ctx.arc(x, y, radius, 0, Math.PI * 2);
            
            const glassGrad = ctx.createRadialGradient(x - 8, y - 8, 4, x, y, radius);
            if (brightness > 0) {
                glassGrad.addColorStop(0, '#ffffff');
                glassGrad.addColorStop(0.4, `rgba(253, 224, 71, ${0.3 + 0.7 * brightness})`);
                glassGrad.addColorStop(1, `rgba(217, 119, 6, ${0.5 + 0.5 * brightness})`);
            } else {
                // Completely Off
                glassGrad.addColorStop(0, 'rgba(71, 85, 105, 0.7)');
                glassGrad.addColorStop(1, 'rgba(30, 41, 59, 0.9)');
            }

            ctx.fillStyle = glassGrad;
            ctx.fill();

            ctx.strokeStyle = brightness > 0 ? `rgba(254, 240, 138, ${0.3 + 0.7 * brightness})` : '#475569';
            ctx.lineWidth = 3;
            ctx.stroke();

            // 4. INTERNAL FILAMENT
            ctx.beginPath();
            ctx.moveTo(x - 12, y + 15);
            ctx.lineTo(x - 6, y - 8);
            ctx.lineTo(x + 6, y - 8);
            ctx.lineTo(x + 12, y + 15);

            if (brightness > 0) {
                ctx.strokeStyle = `rgb(255, ${Math.floor(180 + 75 * brightness)}, ${Math.floor(100 * brightness)})`;
                ctx.lineWidth = 3;
                ctx.shadowColor = '#f59e0b';
                ctx.shadowBlur = 12 * brightness;
            } else {
                ctx.strokeStyle = '#64748b'; // Dark wire when off
                ctx.lineWidth = 2;
                ctx.shadowBlur = 0;
            }
            ctx.stroke();
            ctx.shadowBlur = 0;

            // 5. BULB SOCKET
            const baseW = 24;
            const baseH = 22;
            const baseX = x - radius - baseW + 6;
            const baseY = y - baseH / 2;

            ctx.fillStyle = '#334155';
            ctx.fillRect(baseX, baseY, baseW, baseH);
            ctx.strokeStyle = '#64748b';
            ctx.lineWidth = 2;
            ctx.strokeRect(baseX, baseY, baseW, baseH);

            ctx.beginPath();
            ctx.moveTo(baseX + 6, baseY + 4);
            ctx.lineTo(baseX + 6, baseY + baseH - 4);
            ctx.moveTo(baseX + 14, baseY + 4);
            ctx.lineTo(baseX + 14, baseY + baseH - 4);
            ctx.strokeStyle = '#94a3b8';
            ctx.stroke();
        }

        // Render Frame Loop
        function render() {
            const w = canvas.getBoundingClientRect().width;
            const h = canvas.getBoundingClientRect().height;

            ctx.clearRect(0, 0, w, h);

            const state = getSimulationState();

            const mainY = h * 0.45;
            const startX = 80;
            const endX = w - 120;

            const resistorX = startX + (endX - startX) * 0.42;
            const resistorW = 80;

            const bulbX = endX;
            const bulbY = mainY;
            const groundY = bulbY + 110;

            // Wires
            ctx.strokeStyle = '#38bdf8';
            ctx.lineWidth = 4;
            ctx.lineCap = 'round';

            // Wire 1
            ctx.beginPath();
            ctx.moveTo(startX, mainY);
            ctx.lineTo(resistorX - resistorW / 2, mainY);
            ctx.stroke();

            // Wire 2
            ctx.beginPath();
            ctx.moveTo(resistorX + resistorW / 2, mainY);
            ctx.lineTo(bulbX - 52, mainY);
            ctx.stroke();

            // Wire 3 (Ground)
            ctx.strokeStyle = '#64748b';
            ctx.beginPath();
            ctx.moveTo(bulbX - 52, mainY + 8);
            ctx.lineTo(bulbX - 52, groundY - 12);
            ctx.stroke();

            // Voltage Text
            ctx.fillStyle = '#38bdf8';
            ctx.font = 'bold 26px -apple-system, sans-serif';
            ctx.textAlign = 'right';
            ctx.textBaseline = 'middle';
            ctx.fillText(`${sourceVoltage}V`, startX - 16, mainY);

            // Voltage Node
            ctx.beginPath();
            ctx.arc(startX, mainY, 6, 0, Math.PI * 2);
            ctx.fillStyle = '#0284c7';
            ctx.fill();
            ctx.strokeStyle = '#38bdf8';
            ctx.lineWidth = 2;
            ctx.stroke();

            // Draw Components
            drawResistor(ctx, resistorX, mainY, resistorW, 32, state.currentR);
            drawLightbulb(ctx, bulbX, bulbY, state.brightness);
            drawGround(ctx, bulbX - 52, groundY);

            // Electron Flow Animation (Stops completely when brightness is 0)
            const speedScale = state.brightness * 0.015;

            particles.forEach(p => {
                p.progress += speedScale;
                if (p.progress > 1) p.progress = 0;

                const seg1 = (resistorX - resistorW / 2) - startX;
                const seg2 = (bulbX - 52) - (resistorX + resistorW / 2);
                const seg3 = (groundY - 12) - (mainY + 8);
                const totalDist = seg1 + seg2 + seg3;

                const currDist = p.progress * totalDist;

                let px, py;
                if (currDist < seg1) {
                    px = startX + currDist;
                    py = mainY;
                } else if (currDist < seg1 + seg2) {
                    px = (resistorX + resistorW / 2) + (currDist - seg1);
                    py = mainY;
                } else {
                    px = bulbX - 52;
                    py = (mainY + 8) + (currDist - seg1 - seg2);
                }

                if (state.brightness > 0) {
                    const pRadius = 1.5 + (state.brightness * 3.5);
                    ctx.beginPath();
                    ctx.arc(px, py, pRadius, 0, Math.PI * 2);
                    ctx.fillStyle = '#22d3ee';
                    ctx.shadowColor = '#06b6d4';
                    ctx.shadowBlur = 6 * state.brightness;
                    ctx.fill();
                    ctx.shadowBlur = 0;
                }
            });

            requestAnimationFrame(render);
        }

        // Run
        updateUI();
        requestAnimationFrame(render);
    </script>
</body>
</html>
